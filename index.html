<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="music-player">
        <h1>🎵 Music Player</h1>

        <!-- Song Image -->
         <div class="album-art">
            <div class="musicIcon">🎵</div>
         </div>

         <!-- Song Information -->
          <div class="song-info">
            <h2 id="songTitle">Song Title</h2>
            <p id="artist">Artist Name</p>
          </div>

          <!-- Audio -->
           <audio src="" id="audio"></audio>

           <!-- Progress -->
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <input type="range" name="" id="progress" value="0" min="0" max="100">
                <span id="duration">0:00</span>
            </div>

            <!-- Controls -->
             <div class="controls">
                <button id="previousBtn">⏮️</button>
                <button id="playBtn" class="play-btn">▶️</button>
                <button id="nextBtn">⏭️</button>
             </div>

             <!-- Volume -->
              <div class="volume-control">
                <span>🔊</span>
                <input type="range" name="" id="volume" min="0" max="1" step="0.01" value="1">
              </div>

              <!-- Autoplay -->
               <div class="autoplay">
                <label for="">
                    <input type="checkbox" id="autoplay">
                    Autoplay
                </label>
               </div>

               <!-- Playlist -->
                <div class="playlist">
                    <h3>Playlist</h3>
                    <ul id="playlist"></ul>
                </div>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
